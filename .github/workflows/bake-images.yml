name: Bake Images

on:
  workflow_dispatch:
  push:

env:
  DOCKER: docker
  NAME: "Mender Template"

jobs:
  bake-image:
    name: Bake Images
    runs-on: ${{ matrix.job.runner }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { system: rpi-raspios, runner: ubuntu-24.04-arm }
          - { system: rpi-raspios-pi4, runner: ubuntu-24.04-arm }
          - { system: rpi-debian, runner: ubuntu-24.04-arm }
          - { system: rpi-debian-pi4, runner: ubuntu-24.04-arm }
          - { system: efi-debian-amd64, runner: ubuntu-24.04 }
          - { system: efi-debian-arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Project Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Prepare and Configure
        env:
          SECRET_ENV: ${{ secrets.ENV || '' }}
        run: |
          mkdir build
          if [ -n "${SECRET_ENV}" ]; then
            echo "${SECRET_ENV}" > .env
          fi

      - name: Bake Image
        run: mise run build ${{ matrix.job.system }}

      - name: Bake Bundle
        run: mise run build:bundle -- --disable-compression ${{ matrix.job.system }}

      - name: Restore build directory ownership
        # Docker creates these files as root; the host artifact CLI needs write access.
        run: sudo chown -R "$(id -u):$(id -g)" build

      - name: Build Mender Artifact
        env:
          MENDER_ARTIFACT_DEVICE_TYPE: raspberrypi4
        run: |
          VERSION=$(date +'%Y%m%d.%H%M')
          export VERSION
          MENDER_ARTIFACT_OUTPUT="build/$VERSION.mender" nix develop --command mise run build:artifact ${{ matrix.job.system }}
