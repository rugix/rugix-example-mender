name: Bake Images

on:
  workflow_dispatch:
  push:

env:
  NAME: "Mender Template"

jobs:
  bake-image:
    name: Bake Images
    runs-on: ${{ matrix.job.runner }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { system: rpi-raspios, runner: ubuntu-24.04-arm }
          - { system: rpi-raspios-pi4, runner: ubuntu-24.04-arm }
          - { system: rpi-debian, runner: ubuntu-24.04-arm }
          - { system: rpi-debian-pi4, runner: ubuntu-24.04-arm }
          - { system: efi-debian-amd64, runner: ubuntu-24.04 }
          - { system: efi-debian-arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Prepare and Configure
        env:
          SECRET_ENV: ${{ secrets.ENV || '' }}
        run: |
          mkdir build
          if [ -n "${SECRET_ENV}" ]; then
            echo "${SECRET_ENV}" > .env
          fi

      - name: Bake Image
        run: ./run-bakery bake image ${{ matrix.job.system }}

      - name: Bake Bundle
        run: ./run-bakery bake bundle --disable-compression ${{ matrix.job.system }}

      - name: Build Mender Artifact
        run: |
          VERSION=$(date +'%Y%m%d.%H%M')
          podman run --rm \
              -v "$(pwd)/build":/build \
              docker.io/library/debian:bookworm-slim \
              bash -euc "
                  apt-get update
                  apt-get install -y --no-install-recommends wget ca-certificates
                  wget -nv -O /etc/apt/keyrings/mender.asc \
                      https://downloads.mender.io/repos/debian/gpg
                  echo 'deb [signed-by=/etc/apt/keyrings/mender.asc] https://downloads.mender.io/repos/workstation-tools debian/bookworm/stable main' \
                      > /etc/apt/sources.list.d/mender.list
                  apt-get update
                  apt-get install -y --no-install-recommends mender-artifact=4.4.2-1+debian+bookworm
                  mender-artifact write module-image \
                      -n '${NAME} ${VERSION}' \
                      -t raspberrypi4 \
                      -T rugix-bundle \
                      -f /build/${{ matrix.job.system }}/system.rugixb \
                      -o /build/${VERSION}.mender \
                      --software-name '${NAME}' \
                      --software-version '${VERSION}'
              "

      # - name: Upload Build Artifacts
      #   uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      #   with:
      #     name: ${{ matrix.job.system }}
      #     path: build/*
