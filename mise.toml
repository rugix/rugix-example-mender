[tasks."bakery"]
description = "Run a Rugix Bakery command."
run = "./run-bakery \"$@\""

[tasks."build"]
description = "Build a system image."
run = "./run-bakery bake image \"$@\""

[tasks."build:bundle"]
description = "Build a system update bundle."
run = "./run-bakery bake bundle \"$@\""

[tasks."test"]
description = "Build and test the Mender integration."
run = "bash scripts/run-tests.sh"

[tasks."test:keys"]
description = "Generate the integration-test SSH keys."
run = "bash scripts/generate-test-keys.sh"

[tasks."build:artifact"]
description = "Wrap a system update bundle as a Mender module artifact."
run = 'bash scripts/build-mender-artifact.sh "$@"'
